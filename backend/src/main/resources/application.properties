spring.application.name=backend

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:portfolio_db}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

market-data.alpha-vantage.base-url=${ALPHAVANTAGE_BASE_URL:https://www.alphavantage.co}
market-data.alpha-vantage.api-key=${ALPHAVANTAGE_API_KEY:}
market-data.alpha-vantage.connect-timeout=3s
market-data.alpha-vantage.read-timeout=5s
